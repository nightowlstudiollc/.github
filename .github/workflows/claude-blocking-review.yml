name: Claude Blocking Review

on:
  pull_request:
    types: [opened, synchronize]

# Required by the reusable workflow's run-review job, which declares
# id-token/pull-requests/issues write. A called workflow can only downgrade
# the caller's token, never escalate it, and this repo's
# default_workflow_permissions is "read" -- so omitting this block makes
# every run fail at config time with startup_failure and zero jobs.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    uses: smartwatermelon/github-workflows/.github/workflows/claude-blocking-review.yml@v3.2.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      model: claude-haiku-4-5-20251001
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
