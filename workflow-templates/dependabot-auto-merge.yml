name: Dependabot Auto-Merge

# Caller for the gate in smartwatermelon/github-workflows.
# It merges a Dependabot PR when every check passes.
#
# sanity_checks: check names that build or run the code.
# Lint is not enough. With none, every PR blocks.
#
# Pin the floating dependabot-auto-merge/v3 tag.
# Never a dash-form tag: Dependabot proposes older tags.
#
# Pass the two App secrets by name; never `secrets: inherit`.
# Never add actions/checkout: no PR code runs here.

on: # zizmor: ignore[dangerous-triggers] required to run from base branch; no PR code executed here
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    uses: smartwatermelon/github-workflows/.github/workflows/dependabot-auto-merge.yml@dependabot-auto-merge/v3
    with:
      sanity_checks: 'test' # replace with this repo's build or test check names
    secrets: # these two by name; never `secrets: inherit`
      MERGE_APP_CLIENT_ID: ${{ secrets.MERGE_APP_CLIENT_ID }}
      MERGE_APP_PRIVATE_KEY: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
